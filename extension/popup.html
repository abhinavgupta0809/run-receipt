<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session to Skill</title>
    <style>
      :root { color-scheme: light dark; --ink: #e8eaed; --soft: #9aa3ad; --bg: #0b0e13; --line: #253041; --accent: #4fb8c6; --rec: #e5484d; }
      @media (prefers-color-scheme: light) { :root { --ink: #14181f; --soft: #5b6470; --bg: #ffffff; --line: #d9dee5; --accent: #1a6f7a; } }
      body { width: 300px; margin: 0; padding: 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { margin: 0 0 12px; color: var(--soft); }
      .state { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-variant-numeric: tabular-nums; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); }
      .on .dot { background: var(--rec); animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .on .dot { animation: none; } }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      textarea { box-sizing: border-box; width: 100%; min-height: 54px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; resize: vertical; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.4; cursor: default; }
      .note { margin-top: 12px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Session to Skill</h1>
    <p>Do the task once in this browser. Export it, then turn it into a Perplexity skill.</p>
    <label for="goal">What are you trying to do?</label>
    <textarea id="goal" placeholder="e.g. Compare the monthly price of three note-taking apps"></textarea>
    <div class="state" id="state"><span class="dot"></span><span id="status">Not recording</span></div>
    <div class="row">
      <button id="start" class="primary">Start</button>
      <button id="stop">Stop</button>
    </div>
    <div class="row">
      <button id="export">Export</button>
      <button id="clear">Clear</button>
    </div>
    <p class="note">Password, card and one-time-code fields are never saved. Emails and long numbers are masked. Still, don't record anything private.</p>
    <script src="popup.js"></script>
  </body>
</html>
